name: Build Unsigned IPA to Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15

    env:
      GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      EXPO_PUBLIC_GOOGLE_DRIVE_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_DRIVE_API_KEY }}
      EXPO_PUBLIC_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_DRIVE_FOLDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Xcode Project with XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          echo "✅ Đã khởi tạo DocTruyen.xcodeproj"

      - name: Inject Google Drive Secrets & FullScreen Launch Config into Info.plist
        run: |
          python3 - << 'EOF'
          import os, plistlib

          api_key = (os.environ.get("GOOGLE_DRIVE_API_KEY") or os.environ.get("EXPO_PUBLIC_GOOGLE_DRIVE_API_KEY") or "").strip()
          folder_id = (os.environ.get("GOOGLE_DRIVE_FOLDER_ID") or os.environ.get("EXPO_PUBLIC_GOOGLE_DRIVE_FOLDER_ID") or "").strip()

          print(f"Detected Drive API Key length: {len(api_key)}")
          print(f"Detected Drive Folder ID length: {len(folder_id)}")

          # 1. Ghi trực tiếp vào Info.plist SAU khi chạy xcodegen để không bị xcodegen ghi đè mất UILaunchScreen
          plist_path = "DocTruyen/Info.plist"
          with open(plist_path, "rb") as f:
              pl = plistlib.load(f)
          pl["GoogleDriveAPIKey"] = api_key
          pl["GoogleDriveFolderID"] = folder_id
          pl["UILaunchStoryboardName"] = "LaunchScreen"
          pl["UILaunchScreen"] = {"UIColorName": "", "UIImageName": ""}
          pl["UIRequiresFullScreen"] = True
          with open(plist_path, "wb") as f:
              plistlib.dump(pl, f)

          # 2. Ghi trực tiếp vào hằng số Swift (GeneratedSecrets.swift) để đảm bảo 100% có sẵn khi chạy
          swift_secret_path = "DocTruyen/Models/GeneratedSecrets.swift"
          with open(swift_secret_path, "w", encoding="utf-8") as f:
              f.write("import Foundation\n\n")
              f.write("enum GeneratedSecrets {\n")
              f.write(f'    static let googleDriveApiKey = "{api_key}"\n')
              f.write(f'    static let googleDriveFolderId = "{folder_id}"\n')
              f.write("}\n")
          EOF

      - name: Build Unsigned Archive (SwiftUI Native)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project DocTruyen.xcodeproj \
            -scheme DocTruyen \
            -configuration Release \
            -archivePath build/DocTruyen.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA from Archive
        run: |
          mkdir -p build/Payload
          cp -R build/DocTruyen.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -9 Doc-truyen.ipa Payload
          ls -lh Doc-truyen.ipa

      - name: Generate Tag Name
        id: tag
        run: |
          echo "release_tag=build-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Bản Build Swift ${{ steps.tag.outputs.release_tag }}
          body: "Bản build SwiftUI Native tràn viền 100% kèm kết nối Google Drive & AI Gemini 3.5/3.1 Flash Lite."
          files: build/Doc-truyen.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
