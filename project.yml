name: DocTruyen
options:
  bundleIdPrefix: com.anhhai
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  DocTruyen:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DocTruyen
    info:
      path: DocTruyen/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anhhai.doctruyen
        INFOPLIST_FILE: DocTruyen/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
